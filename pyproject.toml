[build-system]
requires = ["setuptools>=64", "wheel", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "beast"
version = "0.1.0"
description = "Toolkit for parsing and screening chemical libraries.(E.g. ZINC)"
requires-python = ">=3.10,<=3.12"
dependencies = [
  "numpy",
  "pandas",
  "tqdm",
  "pyyaml",
  "simsimd<=6.5.3",
  "zstandard",
]

[tool.setuptools]
packages = ["beast"]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
beast = ["*.so", "*.h", "*.cpp"]

[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
boost-cpp = "*"
compilers = "*"
htslib = "*"
ipykernel = "*"
librdkit-dev = "*"
pytest = "*"
rdkit = "*"
zlib = "*"
numpy = "1.23.*"

[tool.pixi.pypi-dependencies]
beast = { path = ".", editable = true }

[tool.pixi.tasks]
build = { depends-on = ["build-tanimoto", "build-parser"] }
build-tanimoto = "bash compile_tanimoto.sh"
build-parser = "bash compile_parser.sh"
